name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH einrichten
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Nach mythor synchronisieren
        run: |
          rsync -rltz --delete --itemize-changes --chmod=D2775,F664 \
            --exclude='/.git' --exclude='/.github' --exclude='/.gitignore' \
            --exclude='.DS_Store' --exclude='CLAUDE.md' \
            --exclude='/.well-known' --exclude='/googlefd19eec3a33e83a6.html' \
            -e "ssh -p 2222" ./ deploy@65.21.153.165:/
